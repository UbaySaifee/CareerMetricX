[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careermetricx-backend"
version = "0.1.0"
description = "CareerMetricX — Evidence-Grounded Career Readiness & Interview Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CareerMetricX Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pymongo>=4.8.0",
    "motor>=3.5.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
pythonpath = [
    "backend"
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends; E501: Line length for prompts/strings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # Allow sys.path modifications before imports in test fixtures

